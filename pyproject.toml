[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "customer-risk-explainability-pipeline"
version = "0.1.0"
description = "고객 군집·위험 예측·SHAP 해석으로 고객 특성과 모델 판단을 분석하는 파이프라인"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cloudpickle==3.1.2",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "fonttools==4.65.0",
    "joblib==1.6.0",
    "kiwisolver==1.5.1",
    "llvmlite==0.49.0",
    "matplotlib==3.11.2",
    "narwhals==2.26.0",
    "numba==0.67.0",
    "numpy==2.5.3",
    "packaging==26.3",
    "pandas==3.0.5",
    "pillow==12.3.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "shap==0.52.0",
    "six==1.17.0",
    "slicer==0.0.8",
    "threadpoolctl==3.6.0",
    "tqdm==4.70.1",
]

[project.scripts]
customer-risk-cluster = "customer_risk.analysis_clustering:main"
customer-risk-explain = "customer_risk.analysis_shap:main"
customer-risk-generate-data = "customer_risk.generate_data:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/customer_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
markers = ["smoke: 외부 서비스·원본 데이터 변경 없이 주요 실행 경로 검증"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
environments = ["sys_platform != 'darwin' or platform_machine != 'x86_64'"]
